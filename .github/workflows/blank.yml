
name: Build SmartStudentsAI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          echo "Repository files:"
          ls -la
          find . -name settings.gradle.kts -o -name settings.gradle

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: gradlew missing from repository root."
            echo "Upload the Gradle wrapper files first."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartStudentsAI-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
